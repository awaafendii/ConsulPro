# Intégration continue (docs/architecture/06-strategie-de-tests.md §6).
# Chaque étape est bloquante.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'
  STORYBOOK_DISABLE_TELEMETRY: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installation
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Règles de couches (dependency-cruiser)
        run: pnpm depcruise

      - name: Formatage
        run: pnpm format:check

      - name: Tests unitaires, calculs et composants (seuils de couverture)
        run: pnpm test

      - name: Tests d'intégration (PostgreSQL via Testcontainers)
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      - name: Build de Storybook (documentation du design system)
        run: pnpm --filter @consulpro/ui build-storybook

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installation
        run: pnpm install --frozen-lockfile

      - name: PostgreSQL et Mailpit
        run: docker compose -f docker/compose.dev.yml up -d --wait

      - name: Configuration de l'environnement de test
        run: |
          cp packages/db/.env.example packages/db/.env
          cp apps/web/.env.example apps/web/.env.local
          sed -i "s/^BETTER_AUTH_SECRET=.*/BETTER_AUTH_SECRET=\"$(openssl rand -base64 48 | tr -d '\n=+\/')\"/" apps/web/.env.local

      - name: Migrations
        run: pnpm db:deploy

      - name: Build
        run: pnpm build

      - name: Navigateur Playwright
        run: pnpm --filter @consulpro/web exec playwright install --with-deps chromium

      - name: Tests E2E (accessibilité, responsive, clavier, parcours)
        run: pnpm --filter @consulpro/web test:e2e

      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
